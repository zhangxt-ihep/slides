name: Deploy Slidev decks

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: slidev/package-lock.json
      - name: Install dependencies
        working-directory: slidev
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Check sources
        working-directory: slidev
        run: npm run check
      - name: Build all decks
        working-directory: slidev
        run: |
          set -e
          SITE="$(pwd)/_site"
          rm -rf "$SITE" && mkdir -p "$SITE"
          REPO="${{ github.event.repository.name }}"
          for dir in slides/*/; do
            name="$(basename "$dir")"
            echo "=== Building $name ==="
            npx slidev build "$dir/slides.md" --without-notes \
              --out "$SITE/$name" --base "/$REPO/$name/"
          done
          # 根导航页
          {
            echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Slides</title>'
            echo '<style>body{font-family:system-ui;max-width:640px;margin:60px auto;padding:0 20px}li{margin:8px 0}</style>'
            echo '</head><body><h1>Slide decks</h1><ul>'
            for dir in slides/*/; do
              name="$(basename "$dir")"
              echo "<li><a href=\"./$name/\">$name</a></li>"
            done
            echo '</ul></body></html>'
          } > "$SITE/index.html"
          # 根 404.html: SPA fallback，深链接（/<deck>/<page>）保留页码
          cp root-404.html "$SITE/404.html"
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: slidev/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
